/**:
  ros__parameters:
    csv_path_accel_map: $(find-pkg-share carla_autoware_ue5)/calibration/accel_map.csv
    csv_path_brake_map: $(find-pkg-share carla_autoware_ue5)/calibration/brake_map.csv
    csv_path_steer_map: $(find-pkg-share carla_autoware_ue5)/calibration/steer_map.csv
    convert_accel_cmd: true
    convert_brake_cmd: true
    convert_steer_cmd: false
    use_steer_ff: true
    use_steer_fb: true
    is_debugging: false
    # The calibrated accel map covers throttle 0-0.5; 0.4 caps the MKZ at ~1.4 m/s^2.
    max_throttle: 0.5
    max_brake: 0.8
    max_steer: 1.0
    min_steer: -1.0
    steer_pid:
      kp: 150.0
      ki: 15.0
      kd: 0.0
      max: 8.0
      min: -8.0
      max_p: 8.0
      min_p: -8.0
      max_i: 8.0
      min_i: -8.0
      max_d: 0.0
      min_d: 0.0
      invalid_integration_decay: 0.97
